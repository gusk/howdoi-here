name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python: "3.13"
            os: windows-latest
          - python: "3.13"
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,api,mcp]"
      - name: Lint
        run: python -m ruff check .
      - name: Types
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q --cov=hdh --cov-report=term-missing
      - name: Smoke test the CLI with no credentials
        env:
          ANTHROPIC_API_KEY: ""
        run: |
          hdh --version
          hdh context -C tests/fixtures/py_project
          hdh index -C tests/fixtures/py_project
          hdh ask how do i map a list --offline -C tests/fixtures/py_project
