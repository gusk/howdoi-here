[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "howdoi-here"
version = "0.1.0"
description = "howdoi, but it knows what repo you're standing in."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "howdoi-here contributors" }]
keywords = ["cli", "documentation", "codesearch", "developer-tools", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
]
dependencies = ["typer>=0.12", "rich>=13.7"]

[project.optional-dependencies]
api = ["anthropic>=1.0"]  # output_config / adaptive thinking land in 1.x
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
hdh = "hdh.cli:main"

[project.urls]
Homepage = "https://github.com/gusss/howdoi-here"
Issues = "https://github.com/gusss/howdoi-here/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hdh"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["hdh"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
